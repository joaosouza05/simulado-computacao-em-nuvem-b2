apiVersion: batch/v1
kind: CronJob
metadata:
  name: verifica-web
  namespace: simulado-nuvem
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: verifica
            image: busybox:1.36
            command: ["/bin/sh", "-c"]
            args:
            - "wget -qO- http://web"
          restartPolicy: OnFailure
